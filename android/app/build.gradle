plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'dev.rustedition'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.rustedition'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
