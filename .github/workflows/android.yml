name: Android ARM64
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Rust and Android toolchains
        run: |
          rustup target add aarch64-linux-android
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: cargo test --locked
      - run: gradle --no-daemon -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rust-Edition-Android-ARM64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
